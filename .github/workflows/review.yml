name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.9.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@v6
        with:
          version: '12.9.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
